name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            goexperiment: ""
          - name: jsonv2
            goexperiment: jsonv2
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Test
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
        run: go test ./...

      - name: Build
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
        run: go build -o lsql ./cmd/lsql/
